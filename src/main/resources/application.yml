spring:
  application:
    name: oauth2-login
  profiles:
    default: test

server:
  port: 8080

---
spring:
  data:
    redis:
      host: localhost
      port: 6479
  config:
    activate:
      on-profile: dev
  datasource:
    hikari:
      max-lifetime: 1800000 # 30분 (MySQL wait_timeout보다 짧게 설정)
      connection-timeout: 30000
    url: jdbc:mysql://localhost:3306/app?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&createDatabaseIfNotExist=true
    username: app
    password: app

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.format_sql: true
      hibernate.jdbc.time_zone: UTC

jwt:
  access-token-exp-min: 60
  refresh-token-exp-days: 7
  hmac-secret-base64: ${JWT_HMAC_SECRET_BASE64:KO3oQ26nRPzx8aP2MgRwRsqb3BNtMeQ44hEMKDSDzKE=}

---
spring:
  data:
    redis:
      host: localhost
      port: 6479
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate.format_sql: true
      hibernate.jdbc.time_zone: UTC
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

jwt:
  access-token-exp-min: 60
  refresh-token-exp-days: 7
  hmac-secret-base64: ${JWT_HMAC_SECRET_BASE64:KO3oQ26nRPzx8aP2MgRwRsqb3BNtMeQ44hEMKDSDzKE=}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://localhost:3306/app?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&createDatabaseIfNotExist=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

jwt:
  secret: ${JWT_SECRET}
  access-token-exp-min: 60
  refresh-token-exp-days: 7